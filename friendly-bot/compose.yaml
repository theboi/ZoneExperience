name: ${FRIENDLY_BOT_RUNTIME_PROJECT:-friendly-bot-local}

services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - path: .runtime/${FRIENDLY_BOT_RUNTIME_PROFILE:-local}/postgres.env
        required: false
    ports:
      - "127.0.0.1:5833:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s
    networks:
      - friendly-bot
    volumes:
      - friendly-bot-postgres:/var/lib/postgresql/data

networks:
  friendly-bot:
    name: ${FRIENDLY_BOT_RUNTIME_NETWORK:-friendly-bot-local}

volumes:
  friendly-bot-postgres:
    name: ${FRIENDLY_BOT_RUNTIME_VOLUME:-friendly-bot-local-postgres}
