name: friendly-bot-ryanthe

services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - path: .runtime/ryanthe/postgres.env
        required: false
    ports:
      - "127.0.0.1:5833:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s
    networks:
      - friendly-bot-ryanthe
    volumes:
      - friendly-bot-ryanthe-postgres:/var/lib/postgresql/data

networks:
  friendly-bot-ryanthe:
    name: friendly-bot-ryanthe

volumes:
  friendly-bot-ryanthe-postgres:
    name: friendly-bot-ryanthe-postgres
