name: friendly-bot-u504

services:
  postgres:
    image: postgres:16-alpine
    env_file:
      - .runtime/u504/postgres.env
    ports:
      - "127.0.0.1:5832:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 2s
    networks:
      - friendly-bot-u504
    volumes:
      - friendly-bot-u504-postgres:/var/lib/postgresql/data

networks:
  friendly-bot-u504:
    name: friendly-bot-u504

volumes:
  friendly-bot-u504-postgres:
    name: friendly-bot-u504-postgres
